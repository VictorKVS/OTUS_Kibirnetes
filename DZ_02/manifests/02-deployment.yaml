apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-nginx
  namespace: otus-k8s-dz02
spec:
  replicas: 2
  selector:
    matchLabels:
      app: network-nginx
  template:
    metadata:
      labels:
        app: network-nginx
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
