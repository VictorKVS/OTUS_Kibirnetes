apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: otus-k8s-dz01
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-deployment
  template:
    metadata:
      labels:
        app: nginx-deployment
        lesson: dz01
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
