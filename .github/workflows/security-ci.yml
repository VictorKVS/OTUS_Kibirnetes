name: Security CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned minimum tools
        run: python -m pip install "PyYAML==6.0.3"
      - name: Audit Kubernetes YAML
        run: |
          python SECURITY/agent/audit_k8s.py DZ_01/manifests --output security-report.json
        continue-on-error: true
      - name: Run unit tests
        run: python -m unittest discover -s SECURITY/tests -v
      - name: Check for obvious tokens in tracked files
        run: |
          if git grep -nE '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- . ':!*.lock'; then
            echo "::error::Potential credential in tracked files"
            exit 1
          fi
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: security-report.json
          if-no-files-found: warn
          retention-days: 7
